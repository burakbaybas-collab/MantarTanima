<title>Mantar Çiftliği</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: üstte kasa şeridi ve aşama çizelgesi; solda sahne (çiftlik görünümü) + bilgi notu, sağda kontrol paneli; altta çiftlik defteri */
:root{
  --bg:#E9ECE5; --surface:#FAFBF7; --surface2:#F0F2EC; --ink:#1E2420; --muted:#59645C; --line:#CDD3CA;
  --accent:#B4521E; --accent-ink:#FFFFFF; --accent-soft:#F3DFD2;
  --ok:#2E7A4D; --warn:#9C6610; --bad:#B0372B;
  --font-d:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-b:"Inter", "Segoe UI", system-ui, sans-serif;
  --font-m:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121512; --surface:#1A1E1B; --surface2:#222723; --ink:#E6EAE3; --muted:#9AA59C; --line:#313833;
  --accent:#E57D42; --accent-ink:#1B0F07; --accent-soft:#3A2618;
  --ok:#5DC18B; --warn:#E3AB4C; --bad:#F07164; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121512; --surface:#1A1E1B; --surface2:#222723; --ink:#E6EAE3; --muted:#9AA59C; --line:#313833;
  --accent:#E57D42; --accent-ink:#1B0F07; --accent-soft:#3A2618;
  --ok:#5DC18B; --warn:#E3AB4C; --bad:#F07164; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.45}
.app{max-width:1240px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--font-b);font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.stat{display:flex;flex-direction:column}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font-family:var(--font-m);font-size:16px;font-variant-numeric:tabular-nums}
.stat b.neg{color:var(--bad)}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden}
.step{padding:8px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1px;min-width:0}
.step:last-child{border-right:0}
.step .n{font-family:var(--font-m);font-size:10.5px;color:var(--muted)}
.step .t{font-family:var(--font-d);font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done{background:var(--surface2)}
.step.done .t{color:var(--muted)}
.step.cur{background:var(--accent);color:var(--accent-ink)}
.step.cur .n{color:var(--accent-ink);opacity:.8}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.scenewrap{position:relative;border-radius:6px;overflow:hidden;background:#231d19;border:1px solid var(--line)}
#scene{display:block;width:100%;touch-action:manipulation}
.scene-cap{position:absolute;left:10px;top:8px;font-family:var(--font-m);font-size:11px;color:#EFE6DA;background:rgba(20,14,10,.55);padding:3px 7px;border-radius:3px;pointer-events:none}
.info{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.info h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-family:var(--font-b);font-weight:600;margin-bottom:6px}
.info p{margin:0;max-width:68ch;color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.panel .sub{color:var(--muted);margin-top:2px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl-h{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.ctl output{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.ctl small{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);height:22px;margin:0}
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--surface2);display:flex;flex-direction:column;gap:5px;min-width:0}
.g-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.g-h b{font-family:var(--font-m);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-h i{font-style:normal;font-size:11px;color:var(--muted);margin-left:2px}
.g-bar{position:relative;height:8px;background:var(--line);border-radius:2px}
.g-zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.35;border-radius:2px}
.g-mark{position:absolute;top:-3px;width:4px;height:14px;margin-left:-2px;border-radius:1px;background:var(--ink)}
.g-s{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:10px;color:var(--muted)}
.g-ok{border-left:4px solid var(--ok)}
.g-warn{border-left:4px solid var(--warn)}
.g-bad{border-left:4px solid var(--bad)}
.g-bad .g-h b{color:var(--bad)}
.prog{display:flex;flex-direction:column;gap:4px}
.prog .ph{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.prog .ph b{font-family:var(--font-m);color:var(--ink)}
.prog .pb{height:10px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .pb span{display:block;height:100%;background:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:9px 13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:hover:not(:disabled){border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.pri:hover:not(:disabled){filter:brightness(1.08);border-color:var(--accent)}
button.danger{border-color:var(--bad);color:var(--bad);background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button small{font-weight:500;opacity:.8;font-family:var(--font-m);font-size:11px}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--surface2);cursor:pointer}
.choice input{margin-top:3px;accent-color:var(--accent)}
.choice b{display:block}
.choice span{color:var(--muted);font-size:12.5px}
.choice .pr{margin-left:auto;font-family:var(--font-m);font-size:12px;white-space:nowrap;color:var(--ink)}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.note{border-radius:4px;padding:9px 11px;font-size:13px;background:var(--surface2);border:1px solid var(--line)}
.note.bad{border-color:var(--bad);color:var(--bad)}
.note.warn{border-color:var(--warn)}
.note.ok{border-color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--font-m);text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--line);padding-top:5px;color:var(--ink)!important;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
.chart .bd{fill:var(--ok);opacity:.16}
.chart .ax{fill:var(--muted);font-family:var(--font-m);font-size:9px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .pt{fill:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:5px;border:1px solid rgba(0,0,0,.25)}
.logwrap{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.logwrap h3{font-size:15px;margin-bottom:8px}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
#log li{display:grid;grid-template-columns:58px 1fr;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
#log li span{font-family:var(--font-m);color:var(--muted);font-size:11.5px;padding-top:1px}
#log li.bad{color:var(--bad)}
#log li.ok{color:var(--ok)}
.stars{font-size:26px;letter-spacing:4px;color:var(--accent)}
.shop{display:grid;gap:8px}
.shop .it{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--surface2)}
.shop .it div{min-width:0}
.shop .it span{color:var(--muted);font-size:12.5px;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{font-family:var(--font-m)}
.tbl td:first-child{font-family:var(--font-b)}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(4,minmax(0,1fr))}
  .step:nth-child(4){border-right:0}
  .step:nth-child(-n+4){border-bottom:1px solid var(--line)}
}
@media (max-width:600px){ .step{padding:7px 8px} .step .n .s{display:none} .step .t{white-space:normal;hyphens:auto;font-size:12.5px;line-height:1.2} }
@media (max-width:440px){ .gauges{grid-template-columns:minmax(0,1fr)} .brand h1{font-size:22px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="app" lang="tr">
  <header class="top">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 20c0-9 7-15 16-15s16 6 16 15c0 2-1 3-3 3H7c-2 0-3-1-3-3z" fill="var(--accent)"/><path d="M15 23h10l-1 11c0 1-1 2-2 2h-4c-1 0-2-1-2-2z" fill="var(--ink)" opacity=".85"/><circle cx="13" cy="14" r="2" fill="var(--surface)"/><circle cx="24" cy="11" r="1.6" fill="var(--surface)"/><circle cx="28" cy="17" r="1.3" fill="var(--surface)"/></svg>
      <div><h1>Mantar Çiftliği</h1><small>Kompost yığınından hasat kasasına</small></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="steps" id="steps" aria-label="Üretim aşamaları"></nav>
  <main class="grid">
    <section class="col">
      <div class="scenewrap"><canvas id="scene" aria-label="Çiftlik görünümü"></canvas><div class="scene-cap" id="sceneCap"></div></div>
      <div class="info" id="info"></div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <section class="logwrap"><h3>Çiftlik defteri</h3><ol id="log"></ol></section>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(n,d=0)=>Number(n).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});
const tl=n=>fmt(Math.round(n))+' ₺';
const band=(v,lo,hi,tol)=>{ if(v>=lo&&v<=hi) return 1; const d=v<lo?lo-v:v-hi; return clamp(1-d/tol,0,1); };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng=Math.random;

/* ---------- veri ---------- */
const VENT=['Kapalı','Düşük','Orta','Yüksek'];
const STRAINS=[
  {name:'Beyaz – standart hat',price:140,yield:1.0,pm:1,brown:false,d:'Dengeli, hataları affeden hat.'},
  {name:'Beyaz – yüksek verimli hat',price:210,yield:1.12,pm:1,brown:false,d:'%12 daha fazla ürün, misel daha pahalı.'},
  {name:'Kestane (kahverengi) hat',price:180,yield:0.9,pm:1.35,brown:true,d:'Daha az ürün, %35 daha yüksek satış fiyatı.'},
];
const CASINGS=[
  {name:'Siyah torf + kireç',price:950,q:1.0,risk:1,d:'Klasik karışım, suyu iyi tutar.'},
  {name:'Siyah + beyaz torf karışımı',price:1250,q:1.07,risk:1,d:'Daha gözenekli, iğne başları daha düzenli çıkar.'},
  {name:'Bahçe toprağı',price:250,q:0.72,risk:1.8,d:'Ucuz ama yapısı bozuk ve hastalık taşır.'},
];
const WET=['Kuru','İdeal','Çok ıslak'];
const PRICE={A:115,B:78,C:48};
const UPG=[
  {id:'hepa',name:'HEPA filtreli kuluçka havası',price:45000,d:'Küf ve sinek riski %40 azalır.'},
  {id:'klima',name:'Hassas iklim kontrol sistemi',price:35000,d:'Kompost sıcaklığı ayara daha hızlı uyar, CO₂ daha kolay düşer.'},
  {id:'paket',name:'Paketleme ve soğuk zincir',price:55000,d:'Tüm satış fiyatları %12 artar.'},
  {id:'saha',name:'Genişletilmiş kompost sahası',price:70000,d:'Karışım üst sınırları %50 artar.'},
];
const STEPS=[
  {name:'Kompost',sub:'Faz I',st:['karisim','faz1']},
  {name:'Pastörizasyon',sub:'Faz II',st:['faz2']},
  {name:'Misel ekimi',sub:'Tohumlama',st:['ekim']},
  {name:'Kuluçka odası',sub:'Misel sarması',st:['kulucka']},
  {name:'Üretim odası',sub:'Örtü ve şok',st:['ortu','caserun','sok']},
  {name:'Hasat',sub:'3 flaş',st:['hasat']},
  {name:'Satış',sub:'Parti raporu',st:['rapor']},
];

/* ---------- durum ---------- */
function newBatch(){return{
  stage:'karisim',costs:{},log:[],notes:{},
  mix:{straw:5,manure:4,gypsum:150,water:12},mixQ:0,mixInfo:null,
  f1:null,f2:null,comp:null,
  ekim:{rate:0.6,strain:0,dez:true,onluk:true,filtre:false},
  spawn:null,bio:{contam:0,spots:0,pests:0,pestDays:0},
  kul:null,ortu:{type:0,ph:7.5,thick:4.5,wet:1},ortuQ:1,cr:null,ruffled:false,
  sok:null,pinQ:1,kulF:1,h:null,rep:null
};}
function newGame(){return{money:250000,day:1,batchNo:1,up:{},best:null,history:[],B:newBatch()};}
let G;
function load(){ try{ const s=localStorage.getItem('mantarCiftligi.v1'); if(s){ const g=JSON.parse(s); if(g&&g.B) return g; } }catch(e){} return null; }
function save(){ try{ localStorage.setItem('mantarCiftligi.v1',JSON.stringify(G)); }catch(e){} }
let B;

function pay(label,amt){ amt=Math.round(amt); G.money-=amt; B.costs[label]=(B.costs[label]||0)+amt; }
function log(msg,kind=''){ B.log.unshift({d:G.day,msg,kind}); if(B.log.length>80) B.log.pop(); }

/* ---------- hesaplar ---------- */
const cap=()=>G.up.saha?1.5:1;
function mixStats(m){
  const sDM=m.straw*0.88, mDM=m.manure*0.65, gDM=m.gypsum/1000;
  const DM=sDM+mDM+gDM;
  const N=sDM*0.005+mDM*0.035, C=sDM*0.45+mDM*0.32;
  const water=m.straw*0.12+m.manure*0.35+m.water;
  return {DM,N:N/DM*100,CN:C/N,moist:water/(DM+water)*100,gyp:gDM/DM*100,total:DM+water};
}
const mixScore=s=>0.3*band(s.N,1.5,1.9,0.6)+0.25*band(s.CN,20,28,8)+0.3*band(s.moist,70,77,8)+0.15*band(s.gyp,3,6,3.5);
const mixCost=m=>m.straw*3500+m.manure*2000+m.gypsum*6+m.water*40+4000;
const ventCO2=(v)=>Math.round(450+4200/(1+v*(G.up.klima?3:2.3)));
function ortuCalc(){ const o=B.ortu, c=CASINGS[o.type];
  const q=c.q*band(o.ph,7.2,7.9,1.2)*band(o.thick,4,5,2.2)*[0.8,1,0.85][o.wet];
  const area=B.comp?B.comp.t*1000/85:180; const vol=area*o.thick/100;
  return {q,area,vol,cost:vol*c.price+3000}; }

/* ---------- aksiyonlar ---------- */
const ACT={
  mix(){ const s=mixStats(B.mix); pay('Kompost hammaddesi',mixCost(B.mix));
    B.mixInfo=s; B.mixQ=mixScore(s);
    B.f1={day:0,temp:28,o2:18,moist:s.moist,prog:0,anaer:0,turns:0,hist:[28],anim:-9};
    B.stage='faz1';
    log(`Karışım kuruldu: ${fmt(B.mix.straw,1)} t sap, ${fmt(B.mix.manure,1)} t gübre, ${fmt(B.mix.gypsum)} kg jips, ${fmt(B.mix.water)} m³ su. Azot %${fmt(s.N,2)}, C/N ${fmt(s.CN,1)}, nem %${fmt(s.moist,1)}.`);
    if(B.mixQ<0.8) log('Karışım oranları hedeflerin dışında; kompost kalitesi düşük olabilir.','bad');
  },
  f1(a){ const f=B.f1; if(f.day>=18) return;
    if(a==='aktar'){ f.o2=19; f.temp-=12; f.moist-=1.5; f.turns++; f.anim=performance.now()/1000; pay('Kompost aktarma',1800); log(`Yığın aktarıldı (${f.turns}. aktarma).`); }
    if(a==='sula'){ f.moist+=3; pay('Su',400); log('Yığına su verildi.'); }
    const mf=clamp(1-Math.abs(f.moist-74)/18,0.1,1), of=f.o2>6?1:f.o2/6;
    const target=40+42*mf*of;
    f.temp+=(target-f.temp)*0.6;
    f.o2=Math.max(0,f.o2-(4+Math.max(0,f.temp-40)*0.04));
    f.moist-=0.5+Math.max(0,f.temp-50)*0.035;
    if(f.o2<2){ f.anaer++; log('Yığının içi oksijensiz kaldı, kötü koku başladı (anaerobik bölge).','bad'); }
    const tf=f.temp>=62&&f.temp<=82?1:f.temp>=50?0.75:0.35;
    const was=f.prog;
    f.prog=Math.min(100,f.prog+10.5*tf*mf*(f.o2>=2?1:0.5));
    f.day++; G.day++; f.hist.push(+f.temp.toFixed(1));
    if(f.prog>=100&&was<100) log('Faz I kompostu olgunlaştı. Tünele taşıyabilirsiniz.','ok');
  },
  f1done(){ const f=B.f1;
    const q1=B.mixQ*(1-0.07*f.anaer)*(0.55+0.45*Math.min(1,f.prog/100))*(0.6+0.4*band(f.moist,68,78,10));
    B.q1=clamp(q1,0.2,1);
    const nh3=Math.round(220+B.mixInfo.N*140+f.anaer*25);
    B.f2={hour:0,set:52,fresh:20,temp:48,nh3,nh30:nh3,pastH:0,over:0,hist:[48]};
    if(f.anaer) B.notes.anaer=f.anaer; if(f.prog<100) B.notes.f1short=1; if(B.mixQ<0.8) B.notes.mix=1;
    B.stage='faz2'; pay('Tünele doldurma',3500);
    log(`Kompost pastörizasyon tüneline dolduruldu. Amonyak ${nh3} ppm.`);
  },
  f2(n){ const f=B.f2; for(let i=0;i<n;i++){ if(f.hour>=14*24) break;
      const self=f.temp>=40&&f.temp<=60?3:1;
      const target=f.set+self-f.fresh*0.04;
      f.temp+=(target-f.temp)*(G.up.klima?0.6:0.45);
      const wasPast=f.pastH>=8;
      if(f.temp>=57&&f.temp<=63) f.pastH+=4;
      if(f.temp>63){ f.over+=4; if(f.over===4) log('Kompost 63 °C\'yi aştı! Faydalı mikroorganizmalar ölüyor.','bad'); }
      if(!wasPast&&f.pastH>=8) log('Pastörizasyon tamamlandı (8 saat 57–63 °C). Şimdi koşullandırma: 45–48 °C ve taze hava.','ok');
      let k=f.temp>=44&&f.temp<=50?0.16:(f.temp>=40&&f.temp<56)?0.08:0.025;
      k*=0.4+f.fresh/100*0.9;
      const before=f.nh3; f.nh3=Math.max(0,f.nh3*(1-k)-1);
      if(before>10&&f.nh3<=10) log('Amonyak 10 ppm\'in altına indi. Kompost ekime hazır.','ok');
      pay('Tünel enerjisi',180+Math.max(0,f.set-20)*9+f.fresh*5);
      f.hour+=4; if(f.hour%24===0) G.day++;
      f.hist.push(+f.temp.toFixed(1)); }
  },
  f2done(){ const f=B.f2, days=f.hour/24;
    const past=f.pastH>=8;
    const q2=(past?1:0.85)*(1-Math.min(0.35,f.over*0.012))*(1-Math.max(0,days-8)*0.03);
    B.comp={t:B.mixInfo.total*0.6*(1-Math.max(0,days-7)*0.02),q:clamp(B.q1*q2,0.15,1),nh3:Math.round(f.nh3),past};
    if(!past) B.notes.past=1; if(f.over) B.notes.over=f.over; if(f.nh3>10) B.notes.nh3=Math.round(f.nh3);
    B.stage='ekim'; pay('Tünel boşaltma ve soğutma',2500);
    log(`Tünel boşaltıldı: ${fmt(B.comp.t,1)} ton kompost, kalite %${fmt(B.comp.q*100)}.`);
    if(f.nh3>10) log(`Kompostta hâlâ ${Math.round(f.nh3)} ppm amonyak var; misel zarar görecek.`,'bad');
  },
  ekim(){ const e=B.ekim, st=STRAINS[e.strain], c=B.comp;
    const kg=c.t*1000*e.rate/100;
    pay('Misel (tohumluk)',kg*st.price);
    if(e.dez) pay('Hijyen',5000); if(e.onluk) pay('Hijyen',2000); if(e.filtre) pay('Hijyen',8000);
    const dmg=c.nh3>10?Math.min(0.6,(c.nh3-10)/60):0;
    const hepa=G.up.hepa?0.6:1;
    const risk=0.09*(c.past?1:2.6)*(e.dez?0.65:1)*(e.onluk?0.85:1)*(e.filtre?0.7:1)*hepa;
    const pestRisk=0.07*(e.filtre?0.5:1)*hepa*(c.past?1:1.8);
    B.spawn={kg,rate:e.rate,strain:e.strain,dmg,risk,pestRisk};
    B.kul={day:0,set:23,hum:93,vent:1,ctemp:26,col:0,co2:3600,dmg:0,hist:[26]};
    B.stage='kulucka';
    log(`${fmt(kg)} kg ${st.name} miseli komposta karıştırıldı ve raflara dolduruldu.`);
    if(dmg>0) log('Amonyak miseli yaktı; bazı tohumlar çimlenmedi.','bad');
  },
  grow(n){ const mode=B.stage==='kulucka'?'kul':'cr'; const S=mode==='kul'?B.kul:B.cr;
    for(let i=0;i<n;i++){ if(S.col>=100||S.day>=30) break; const sp=B.bio.spots, pe=B.bio.pests; growDay(S,mode); if(n>1&&(B.bio.spots>sp||B.bio.pests>pe)) break; } },
  clean(){ const b=B.bio; pay('Hastalık mücadelesi',1200*b.spots); log(`${b.spots} küf lekesi kireç ve tuzla kapatıldı, çevresi temizlendi.`,'ok'); b.spots=0; },
  trap(){ pay('Hastalık mücadelesi',1500); log('Sarı yapışkan tuzaklar ve ışık tuzağı kuruldu, sinekler kontrol altında.','ok'); B.bio.pests=0; },
  kuldone(){ const S=B.kul; B.kulF=clamp(1-S.dmg/100,0.3,1)*Math.min(1,0.4+0.6*S.col/100);
    if(S.dmg>0) B.notes.heat=Math.round(S.dmg); B.stage='ortu';
    log(`Kuluçka bitti (${S.day} gün). Kolonizasyon %${fmt(S.col)}.`); },
  ortu(){ const o=ortuCalc(); pay('Örtü toprağı',o.cost); B.ortuQ=clamp(o.q,0.4,1.07);
    if(o.q<0.85) B.notes.casing=1;
    B.cr={day:0,set:23,hum:94,vent:1,ctemp:B.kul.ctemp,col:0,co2:5000,dmg:0,hist:[+B.kul.ctemp.toFixed(1)]};
    B.stage='caserun';
    log(`${fmt(o.vol,1)} m³ örtü toprağı (${CASINGS[B.ortu.type].name}) ${fmt(B.ortu.thick,1)} cm kalınlıkta serildi.`); },
  ruffle(){ B.ruffled=true; pay('Örtü karıştırma',2500); log('Örtü toprağı karıştırıldı (ruffling); misel daha eşit dağılacak.','ok'); },
  crdone(){ const S=B.cr; B.ortuQ*=Math.min(1,0.5+0.5*S.col/100);
    B.sok={day:0,set:22,hum:92,vent:1,ctemp:S.ctemp,co2:ventCO2(1),pins:0,qsum:0,qdays:0,hist:[+S.ctemp.toFixed(1)]};
    B.stage='sok'; log('Misel örtü toprağının yüzeyine ulaştı. Şoklama zamanı.'); },
  sok(n){ const S=B.sok; for(let i=0;i<n;i++){ if(S.pins>=100||S.day>=12) break; sokDay(S); } },
  sokdone(){ const S=B.sok; B.pinQ=(S.qdays?S.qsum/S.qdays:0.4)*Math.min(1,0.3+0.7*S.pins/100);
    if(B.pinQ<0.75) B.notes.pin=1; startHarvest(); },
  flush(){ startFlush(); },
  water(w){ const h=B.h; h.waterMult=[0.82,1,0.97][w]; h.wetBoost=[-1,0,3][w];
    pay('Sulama',[600,1000,1600][w]); pay('Enerji ve işçilik',7*900); G.day+=7;
    log(`Flaşlar arası sulama: ${['az','orta','bol'][w]}. 7 gün sonra yeni flaş geliyor.`); startFlush(); },
  sell(){ finishBatch(); },
  buy(id){ const u=UPG.find(x=>x.id===id); if(!u||G.up[id]||G.money<u.price) return; G.money-=u.price; G.up[id]=true; log(`Yatırım yapıldı: ${u.name}.`,'ok'); },
  next(){ G.batchNo++; G.day+=2; B=G.B=newBatch(); log(`${G.batchNo}. parti başladı.`); },
  reset(arg){ if(arg!=='ok'){ confirmReset=true; return; } G=newGame(); B=G.B; confirmReset=false; log('Yeni çiftlik kuruldu. Kasada 250.000 ₺ var.'); },
  resetno(){ confirmReset=false; },
};
let confirmReset=false;

function growDay(S,mode){
  const k=G.up.klima?0.85:0.6;
  const metab=mode==='kul'?1.5+6.5*Math.sin(Math.PI*Math.min(1,S.col/100)):2.5;
  S.ctemp+=((S.set+metab-S.vent*1.5)-S.ctemp)*k;
  S.co2=Math.round(900+9000*(0.3+0.7*S.col/100)/(1+S.vent*1.3));
  const t=S.ctemp;
  const tf=(t>=24&&t<=27)?1:(t>=22&&t<=28)?0.78:(t>=20&&t<=30)?0.5:t>30?0.15:0.25;
  if(t>30){ S.dmg+=(t-30)*2.5; log(`Kompost ${fmt(t,1)} °C! Misel aşırı ısıdan zarar görüyor.`,'bad'); }
  const hf=S.hum>=90?1:S.hum>=85?0.8:0.55;
  if(mode==='kul'){ const cf=S.co2>=4000?1.05:0.95; const sf=0.7+0.4*Math.min(1,B.spawn.rate);
    S.col=Math.min(100,S.col+7.4*tf*hf*cf*sf*(1-B.spawn.dmg)*(0.6+0.4*B.comp.q)); }
  else { const th=B.ortu.thick>5.5?0.8:1; S.col=Math.min(100,S.col+15*tf*hf*th*(0.7+0.3*Math.min(1,B.ortuQ))); }
  pay('Enerji ve işçilik',700+Math.abs(S.set-15)*45+S.vent*220+Math.max(0,S.hum-85)*30);
  riskDay(S,mode==='cr'?CASINGS[B.ortu.type].risk*(B.ortu.wet===2?1.4:1)*0.8:1);
  S.day++; G.day++; S.hist.push(+S.ctemp.toFixed(1));
  if(S.col>=100) log(mode==='kul'?'Misel kompostu tamamen sardı! Kuluçka tamam.':'Misel örtü toprağını sardı.','ok');
}
function riskDay(S,mult){
  const b=B.bio; const r=B.spawn.risk*mult*(S.ctemp>28?1.6:1)*(S.hum>96?1.5:1);
  if(rng()<r){ b.spots++; log('Yeşil küf (Trichoderma) lekesi görüldü!','bad'); }
  if(rng()<B.spawn.pestRisk*mult){ if(!b.pests) log('Mantar sinekleri (Sciarid) görüldü!','bad'); b.pests++; }
  b.contam=Math.min(60,b.contam+b.spots*1.4+b.pests*0.3);
  if(b.pests) b.pestDays++;
}
function sokDay(S){
  const k=G.up.klima?0.7:0.45;
  S.ctemp+=(S.set+1.5-S.vent*0.6-S.ctemp)*k;
  S.co2=ventCO2(S.vent);
  const humEff=S.hum-S.vent*1.2;
  const q=band(S.ctemp,16,19,4)*band(S.co2,0,1000,1400)*band(humEff,85,93,7);
  const before=S.pins;
  S.pins=Math.min(100,S.pins+38*q);
  if(q>0.15){ S.qsum+=q; S.qdays++; }
  pay('Enerji ve işçilik',700+Math.abs(S.set-15)*45+S.vent*260+Math.max(0,S.hum-85)*30);
  riskDay(S,0.5);
  S.day++; G.day++; S.hist.push(+S.ctemp.toFixed(1));
  if(before<30&&S.pins>=30) log('Örtü toprağında ilk iğne başları (primordia) göründü!','ok');
  if(S.pins>=100) log('İğne başları tamamlandı. Hasada hazırlanın.','ok');
  if(q<0.15&&S.day>=3) log('İğne başı oluşmuyor: sıcaklığı 16–19 °C\'ye düşürün, CO₂\'yi 1000 ppm altına indirin.','bad');
}

/* ---------- hasat ---------- */
let H=null;
function startHarvest(){
  const b=B.bio, st=STRAINS[B.spawn.strain];
  const BE=0.31*(0.45+0.55*B.comp.q)*B.kulF*(1-Math.min(0.7,b.contam/100))*(1-Math.min(0.3,b.pestDays*0.012))*B.ortuQ*(0.55+0.45*B.pinQ)*(1-B.spawn.dmg*0.6)*st.yield*(B.ruffled?1.04:1);
  if(b.contam>5) B.notes.contam=Math.round(b.contam); if(b.pestDays>3) B.notes.pest=b.pestDays;
  B.h={flush:0,phase:'ready',totalKg:B.comp.t*1000*BE,BE,kg:{A:0,B:0,C:0},lost:0,waterMult:1,wetBoost:0,set:17,hum:90,vent:2};
  B.stage='hasat';
  log('Üretim odası hasada hazır. İlk flaş geliyor.');
}
function startFlush(){
  const h=B.h,k=h.flush; const kg=h.totalKg*[0.5,0.32,0.18][k]*h.waterMult;
  const n=[44,34,26][k]; const r=mulberry32(G.batchNo*131+k*17+3); const sp=[];
  for(let i=0;i<n;i++){ let x,y,ok=false,tries=0;
    while(!ok&&tries<40){ x=0.06+r()*0.88; y=0.12+r()*0.8; ok=sp.every(s=>Math.hypot((s.x-x)*1.6,s.y-y)>0.085); tries++; }
    sp.push({x,y,born:r()*24,j:0.85+r()*0.3,s:0,bl:false,ls:false,pk:false,dead:false}); }
  H={t:0,sp,kgPer:kg/n,fl:[],acc:{A:0,B:0,C:0,lost:0},last:performance.now()};
  h.phase='running'; liveTick=0;
}
function harvestUpdate(dt){
  const h=B.h; H.t+=dt;
  const rate=(1/15)*(1+(h.set-17)*0.13);
  const co2=ventCO2(h.vent), humEff=h.hum-h.vent*1.2+h.wetBoost;
  let active=0;
  for(const s of H.sp){ if(s.pk||s.dead) continue; active++; if(H.t<s.born) continue;
    const prev=s.s; s.s+=dt*rate*s.j;
    if(prev<0.45&&s.s>=0.45&&co2>1100) s.ls=true;
    if(s.s>0.3&&!s.bl&&humEff>93&&Math.random()<dt*0.02*(humEff-93)) s.bl=true;
    if(s.s>1.2){ s.dead=true; H.acc.lost+=H.kgPer*1.1; } }
  if(active===0) endFlush();
}
function pickAt(px,py){
  if(!H||B.h.phase!=='running') return;
  let best=null,bd=1e9;
  for(const s of H.sp){ if(s.pk||s.dead||H.t<s.born||s.s<0.12) continue;
    const p=bedPos(s), r=mushR(s.s)+10, d=Math.hypot(p.x-px,p.y-py);
    if(d<r&&d<bd){bd=d;best=s;} }
  if(!best) return;
  const h=B.h, s=best; let w=H.kgPer*Math.min(1.15,0.35+s.s), cls;
  if(s.s<0.45){cls='C';w*=0.7;} else if(s.s<0.75) cls='A'; else if(s.s<0.92) cls='B'; else cls='C';
  if(s.bl||s.ls) cls=cls==='A'?'B':'C';
  if(h.hum-h.vent*1.2+h.wetBoost<84) w*=0.9;
  s.pk=true; H.acc[cls]+=w;
  const p=bedPos(s); H.fl.push({x:p.x,y:p.y,t:H.t,txt:`${cls} +${fmt(w,1)} kg`,c:cls==='A'?'#8BE0A6':cls==='B'?'#F2C66B':'#F09A8A'});
}
function endFlush(){
  const h=B.h,a=H.acc; const got=a.A+a.B+a.C;
  h.kg.A+=a.A; h.kg.B+=a.B; h.kg.C+=a.C; h.lost+=a.lost;
  pay('Hasat işçiliği',got*6); pay('Enerji ve işçilik',4500+h.vent*600);
  log(`${h.flush+1}. flaş: ${fmt(got)} kg toplandı (A ${fmt(a.A)} · B ${fmt(a.B)} · C ${fmt(a.C)}), ${fmt(a.lost)} kg çürüdü.`, a.lost>got*0.15?'bad':'ok');
  h.last={...a}; h.flush++; h.phase=h.flush>=3?'done':'between'; H=null; G.day+=3; save(); render();
}
function finishBatch(){
  const h=B.h, st=STRAINS[B.spawn.strain], mult=st.pm*(G.up.paket?1.12:1);
  const rev={A:h.kg.A*PRICE.A*mult,B:h.kg.B*PRICE.B*mult,C:h.kg.C*PRICE.C*mult};
  const revenue=rev.A+rev.B+rev.C; G.money+=revenue;
  const cost=Object.values(B.costs).reduce((a,b)=>a+b,0);
  const total=h.kg.A+h.kg.B+h.kg.C;
  const BE=total/(B.comp.t*1000)*100;
  if(total>0&&h.kg.A/total<0.5) B.notes.late=1;
  if(h.lost>total*0.1) B.notes.lost=Math.round(h.lost);
  B.rep={rev,revenue,cost,profit:revenue-cost,total,BE,mult};
  G.history.push({n:G.batchNo,profit:Math.round(revenue-cost),BE:+BE.toFixed(1)});
  if(G.best===null||revenue-cost>G.best) G.best=Math.round(revenue-cost);
  B.stage='rapor'; log(`Ürün satıldı: ${tl(revenue)} gelir. Parti kârı ${tl(revenue-cost)}.`, revenue>cost?'ok':'bad');
}

/* ---------- arayüz parçaları ---------- */
let BIND={};
function slider(id,label,val,min,max,step,unit,set,hint,show){
  BIND[id]={set,unit,show:show||(v=>fmt(v,step<1?(step<0.1?2:1):0))};
  return `<label class="ctl" for="${id}"><span class="ctl-h"><span>${label}</span><output id="${id}-o">${BIND[id].show(val)}${unit?' '+unit:''}</output></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">${hint?`<small>${hint}</small>`:''}</label>`;
}
function gauge(label,v,unit,min,max,lo,hi,dec=0){
  const p=x=>clamp((x-min)/(max-min)*100,0,100);
  const st=(v>=lo&&v<=hi)?'ok':(band(v,lo,hi,(max-min)*0.12)>0?'warn':'bad');
  const fl=v=>fmt(v,dec);
  return `<div class="g g-${st}"><div class="g-h"><span>${label}</span><b>${fl(v)}<i>${unit}</i></b></div><div class="g-bar"><span class="g-zone" style="left:${p(lo)}%;width:${Math.max(1.5,p(hi)-p(lo))}%"></span><span class="g-mark" style="left:${p(v)}%"></span></div><div class="g-s"><span>${fmt(min)}</span><span>hedef ${fl(lo)}–${fl(hi)}</span><span>${fmt(max)}</span></div></div>`;
}
function prog(label,v,txt){ return `<div class="prog"><div class="ph"><span>${label}</span><b>${txt||'%'+fmt(v)}</b></div><div class="pb"><span style="width:${clamp(v,0,100)}%"></span></div></div>`; }
function chart(hist,lo,hi,okLo,okHi,xlab){
  const W=320,Hh=96,pl=26,pr=6,pt=6,pb=16; if(!hist||hist.length<1) return '';
  const X=i=>pl+(hist.length<2?0:i/(hist.length-1))*(W-pl-pr), Y=v=>pt+(1-(clamp(v,lo,hi)-lo)/(hi-lo))*(Hh-pt-pb);
  const pts=hist.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last=hist.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Sıcaklık geçmişi"><rect class="bd" x="${pl}" y="${Y(okHi)}" width="${W-pl-pr}" height="${Y(okLo)-Y(okHi)}"/>`+
   [lo,okLo,okHi,hi].map(v=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-4}" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join('')+
   `<polyline class="ln" points="${pts}"/><circle class="pt" cx="${X(last)}" cy="${Y(hist[last])}" r="3"/><text class="ax" x="${W-pr}" y="${Hh-3}" text-anchor="end">${xlab}</text><text class="ax" x="${pl}" y="${Hh-3}">°C</text></svg>`;
}
function climateCtl(S,pre,tmin,tmax,hint){
  return slider(pre+'set','Oda hava sıcaklığı',S.set,tmin,tmax,0.5,'°C',v=>S.set=v,hint)+
    slider(pre+'hum','Bağıl nem',S.hum,78,99,1,'%',v=>S.hum=v)+
    slider(pre+'vent','Taze hava (havalandırma)',S.vent,0,3,1,'',v=>S.vent=v,null,v=>VENT[v]);
}
function bioCtl(){ const b=B.bio; let s='';
  if(b.spots) s+=`<button data-act="clean" class="danger">Küf lekelerini temizle <small>${b.spots} leke · ${tl(1200*b.spots)}</small></button>`;
  if(b.pests) s+=`<button data-act="trap" class="danger">Sinek tuzağı kur <small>${tl(1500)}</small></button>`;
  return s?`<div class="btns">${s}</div>`:''; }
function bioNote(){ const b=B.bio; if(!b.spots&&!b.pests&&b.contam<1) return '';
  return `<div class="note ${b.spots||b.pests?'bad':'warn'}">${b.spots?`${b.spots} aktif yeşil küf lekesi yayılıyor. `:''}${b.pests?'Mantar sinekleri raflarda dolaşıyor. ':''}Toplam bulaşma %${fmt(b.contam,1)}.</div>`; }

  panel(){ const f=B.f1, end=f.day>=18;
   return `<div><h2>Faz I · Kompost yığını</h2><div class="sub">${f.day}. gün · ${f.turns} aktarma. Her işlem bir gün sürer.</div></div>
   <div class="gauges">${gauge('Yığın iç sıcaklığı',f.temp,'°C',20,90,68,80,1)}${gauge('İçerideki oksijen',f.o2,'%',0,21,4,21,1)}${gauge('Nem',f.moist,'%',55,90,70,78,1)}<div class="g">${prog('Olgunlaşma',f.prog)}</div></div>
   <div class="sec"><span class="sec-t">Sıcaklık geçmişi</span>${chart(f.hist,20,90,68,80,f.day+'. gün')}</div>
   <div class="btns"><button data-act="f1:aktar" class="pri" ${end?'disabled':''}>Aktar (çevir) <small>${tl(1800)}</small></button><button data-act="f1:sula" ${end?'disabled':''}>Su ver <small>${tl(400)}</small></button><button data-act="f1:bekle" ${end?'disabled':''}>Bekle</button></div>
   ${f.prog>=80?`<div class="btns"><button class="pri" data-act="f1done">Tünele taşı (Faz II) <small>${tl(3500)}</small></button></div>`:`<div class="note">Kompost %80 olgunlaşınca tünele taşıyabilirsiniz.</div>`}
   ${f.prog>=80&&f.prog<100?'<div class="note warn">Kompost tam olgunlaşmadı. Şimdi taşırsanız kalite düşer.</div>':''}`; }},
 faz2:{cap:()=>`Faz II · tünel · ${Math.floor(B.f2.hour/24)}. gün ${B.f2.hour%24}:00`,
  info:'Faz II kapalı tünelde yapılır. Önce kompost 58–60 °C\'de en az 8 saat tutularak zararlılar ve rakip mikroorganizmalar öldürülür (pastörizasyon). 63 °C\'nin üzeri faydalı mikropları da öldürür. Ardından 45–48 °C\'de taze hava verilerek amonyak 10 ppm\'in altına indirilir (koşullandırma). Amonyak misel için zehirlidir.',
  panel(){ const f=B.f2, end=f.hour>=14*24, past=f.pastH>=8;
   const tlo=past?45:57, thi=past?48:60;
   return `<div><h2>Faz II · Pastörizasyon tüneli</h2><div class="sub">${Math.floor(f.hour/24)} gün ${f.hour%24} saat geçti. ${past?'Pastörizasyon tamam, şimdi koşullandırma.':'Önce pastörizasyon: 58–60 °C, 8 saat.'}</div></div>
   <div class="sec">${slider('f2s','Üflenen hava sıcaklığı',f.set,35,68,1,'°C',v=>f.set=v)}${slider('f2f','Taze hava oranı',f.fresh,0,100,5,'%',v=>f.fresh=v,'Taze hava amonyağı uzaklaştırır ama ısıtma maliyetini artırır.')}</div>
   <div class="gauges">${gauge('Kompost sıcaklığı',f.temp,'°C',35,70,tlo,thi,1)}${gauge('Amonyak',f.nh3,'ppm',0,Math.max(100,f.nh30),0,10,0)}<div class="g">${prog('Pastörizasyon (57–63 °C)',Math.min(100,f.pastH/8*100),fmt(Math.min(f.pastH,8))+' / 8 saat')}</div><div class="g">${prog('Koşullandırma',clamp((f.nh30-f.nh3)/(f.nh30-10)*100,0,100))}</div></div>
   <div class="sec"><span class="sec-t">Kompost sıcaklığı (4 saatlik adımlar)</span>${chart(f.hist.slice(-60),35,70,tlo,thi,'şimdi')}</div>
   <div class="btns"><button data-act="f2:1" ${end?'disabled':''}>4 saat ilerlet</button><button data-act="f2:6" ${end?'disabled':''}>1 gün ilerlet</button></div>
   <div class="btns"><button class="pri" data-act="f2done">Tüneli boşalt, soğut <small>${tl(2500)}</small></button></div>
   ${!past?'<div class="note warn">Pastörizasyon yapılmadan boşaltılırsa küf ve sinek riski çok artar.</div>':f.nh3>10?'<div class="note warn">Amonyak 10 ppm\'in üzerinde. Bu kompost miseli yakar.</div>':'<div class="note ok">Kompost ekime hazır.</div>'}`; }},
 ekim:{cap:()=>'Ekim salonu · misel karıştırma',
  info:'Misel (tohumluk), steril tahıl taneleri üzerinde üretilmiş mantar ipliğidir. Kompost ağırlığının %0,5–1\'i kadar misel karıştırılır. Daha çok misel kolonizasyonu hızlandırır ama maliyeti artırır. Bu aşamada hijyen, ilerideki küf ve sinek sorunlarının çoğunu önler.',
  panel(){ const e=B.ekim,c=B.comp;
   return `<div><h2>Misel ekimi</h2><div class="sub">${fmt(c.t,1)} t kompost · kalite %${fmt(c.q*100)} · amonyak ${c.nh3} ppm · ${c.past?'pastörize':'pastörize edilmedi'}</div></div>
   <div class="sec"><span class="sec-t">Misel hattı</span><div class="choices">${STRAINS.map((s,i)=>`<label class="choice ${e.strain===i?'on':''}"><input type="radio" name="strain" value="${i}" ${e.strain===i?'checked':''} data-bind="strain"><div><b>${s.name}</b><span>${s.d}</span></div><span class="pr">${s.price} ₺/kg</span></label>`).join('')}</div></div>
   <div class="sec">${slider('ekr','Misel oranı (kompost ağırlığına göre)',e.rate,0.2,1.5,0.1,'%',v=>e.rate=v,'Önerilen: %0,5–1.')}</div>
   <div class="sec"><span class="sec-t">Hijyen önlemleri</span><div class="choices">
    ${[['dez','Ekipman ve oda dezenfeksiyonu',5000,'Küf riskini belirgin azaltır.'],['onluk','Önlük, eldiven, ayak dezenfeksiyonu',2000,'Personel kaynaklı bulaşmayı azaltır.'],['filtre','Sinek ağı ve hava filtresi',8000,'Sinek riskini yarıya indirir, küfü de azaltır.']].map(([k,n,p,d])=>`<label class="choice ${e[k]?'on':''}"><input type="checkbox" data-bind="${k}" ${e[k]?'checked':''}><div><b>${n}</b><span>${d}</span></div><span class="pr">${tl(p)}</span></label>`).join('')}
   </div></div><div id="live"></div>`; },
  live(){ const e=B.ekim,c=B.comp,st=STRAINS[e.strain]; const kg=c.t*1000*e.rate/100;
   const hyg=(e.dez?5000:0)+(e.onluk?2000:0)+(e.filtre?8000:0);
   return `<div class="kv"><span>Misel miktarı</span><span>${fmt(kg)} kg</span><span>Misel bedeli</span><span>${tl(kg*st.price)}</span><span>Hijyen</span><span>${tl(hyg)}</span><span class="tot">Toplam</span><span class="tot">${tl(kg*st.price+hyg)}</span></div>
   ${c.nh3>10?`<div class="note bad">Kompostta ${c.nh3} ppm amonyak var. Misel kısmen ölecek.</div>`:''}
   <div class="btns"><button class="pri" data-act="ekim">Miseli ek ve kuluçkaya al</button></div>`; }},
 kulucka:{cap:()=>`Kuluçka odası · ${B.kul.day}. gün`,
  info:'Kuluçkada (spawn run) misel 14–18 günde kompostu sarar. Kompost sıcaklığı 24–27 °C, nem %90–95 olmalıdır. Misel çoğaldıkça ısı üretir; kompost 30 °C\'yi geçerse misel ölmeye başlar. Bu yüzden oda sıcaklığını düşürün veya havalandırın. Bu evrede yüksek CO₂ zararsızdır, hatta gelişimi destekler.',
  panel(){ const S=B.kul, done=S.col>=100;
   return `<div><h2>Kuluçka odası</h2><div class="sub">${S.day}. gün · misel kompostu sarıyor. Misel ısındıkça odayı serinletin.</div></div>
   <div class="sec">${climateCtl(S,'ku',16,30,'Kompost, oda havasından birkaç derece sıcaktır.')}</div>
   <div class="gauges">${gauge('Kompost sıcaklığı',S.ctemp,'°C',16,34,24,27,1)}${gauge('Oda CO₂',S.co2,'ppm',0,10000,4000,10000)}<div class="g">${prog('Kolonizasyon',S.col)}</div>${gauge('Bulaşma (küf/sinek)',B.bio.contam,'%',0,30,0,2,1)}</div>
   ${bioNote()}${bioCtl()}
   <div class="sec"><span class="sec-t">Kompost sıcaklığı</span>${chart(S.hist,16,34,24,27,S.day+'. gün')}</div>
   ${done||S.day>=28?`<div class="btns"><button class="pri" data-act="kuldone">Örtü toprağına geç</button></div>`:`<div class="btns"><button class="pri" data-act="grow:1">1 gün ilerlet</button><button data-act="grow:3">3 gün ilerlet</button></div>`}`; }},
 ortu:{cap:()=>'Üretim odası · örtü toprağı',
  info:'Örtü toprağı (casing) olmadan beyaz şapkalı mantar meyve vermez. Torf ve kireç karışımı 4–5 cm kalınlıkta serilir, pH 7,2–7,9 olmalıdır. Örtü toprağı nemi tutar ve mantar oluşumunu tetikleyen bakterilere ortam sağlar.',
  panel(){ const o=B.ortu;
   return `<div><h2>Üretim odası · Örtü toprağı</h2><div class="sub">Raflar üretim odasına taşındı. Kompostun üstüne örtü toprağı serin.</div></div>
   <div class="sec"><span class="sec-t">Örtü malzemesi</span><div class="choices">${CASINGS.map((c,i)=>`<label class="choice ${o.type===i?'on':''}"><input type="radio" name="cas" value="${i}" ${o.type===i?'checked':''} data-bind="cas"><div><b>${c.name}</b><span>${c.d}</span></div><span class="pr">${fmt(c.price)} ₺/m³</span></label>`).join('')}</div></div>
   <div class="sec">${slider('orp','pH (kireç ile ayarlanır)',o.ph,5.5,9,0.1,'',v=>o.ph=v)}${slider('ort','Kalınlık',o.thick,2,7.5,0.5,'cm',v=>o.thick=v)}${slider('orw','Örtü nemi',o.wet,0,2,1,'',v=>o.wet=v,null,v=>WET[v])}</div>
   <div id="live"></div>`; },
  live(){ const c=ortuCalc();
   return `<div class="sec">${prog('Örtü kalitesi',Math.min(100,c.q*100))}<div class="kv"><span>Raf alanı</span><span>${fmt(c.area)} m²</span><span>Örtü hacmi</span><span>${fmt(c.vol,1)} m³</span><span class="tot">Maliyet (işçilik dahil)</span><span class="tot">${tl(c.cost)}</span></div>
   <div class="btns"><button class="pri" data-act="ortu">Örtü toprağını ser</button></div></div>`; }},
 caserun:{cap:()=>`Üretim odası · örtü altı gelişme · ${B.cr.day}. gün`,
  info:'Misel 6–9 günde örtü toprağının içine doğru yürür. Bu sırada kompost 23–26 °C ve nem %92\'nin üzerinde tutulur. Yaklaşık yarı yolda örtüyü karıştırmak (ruffling) misel dağılımını eşitler; iğne başları daha düzenli çıkar.',
  panel(){ const S=B.cr, done=S.col>=100;
   return `<div><h2>Örtü altı gelişme</h2><div class="sub">${S.day}. gün · misel örtü toprağına yürüyor.</div></div>
   <div class="sec">${climateCtl(S,'cr',16,30)}</div>
   <div class="gauges">${gauge('Kompost sıcaklığı',S.ctemp,'°C',16,34,23,26,1)}${gauge('Bağıl nem',S.hum,'%',78,99,92,96)}<div class="g">${prog('Misel örtüde',S.col)}</div>${gauge('Bulaşma',B.bio.contam,'%',0,30,0,2,1)}</div>
   ${bioNote()}${bioCtl()}
   ${!B.ruffled&&S.col>=25&&S.col<=75?`<div class="btns"><button data-act="ruffle">Örtüyü karıştır (ruffling) <small>${tl(2500)}</small></button></div>`:''}
   ${B.ruffled?'<div class="note ok">Örtü karıştırıldı.</div>':S.col<25?'<div class="note">Misel örtünün %25–75\'ine ulaşınca örtüyü karıştırabilirsiniz.</div>':''}
   ${done||S.day>=14?`<div class="btns"><button class="pri" data-act="crdone">Şoklamaya geç</button></div>`:`<div class="btns"><button class="pri" data-act="grow:1">1 gün ilerlet</button><button data-act="grow:3">3 gün ilerlet</button></div>`}`; }},
 sok:{cap:()=>`Üretim odası · şoklama · ${B.sok.day}. gün`,
  info:'Mantar oluşumu için oda "şoklanır": hava sıcaklığı 16–18 °C\'ye düşürülür, bol taze hava ile CO₂ 1000 ppm\'in altına indirilir, nem %85–92 tutulur. 2–4 gün içinde iğne başları (primordia) oluşur. CO₂ yüksek kalırsa az sayıda, uzun saplı mantar çıkar.',
  panel(){ const S=B.sok, done=S.pins>=100; const humEff=S.hum-S.vent*1.2;
   return `<div><h2>Şoklama · iğne başı oluşumu</h2><div class="sub">${S.day}. gün · havayı soğutun, taze hava verin.</div></div>
   <div class="sec">${climateCtl(S,'so',12,26,'Kompost sıcaklığı hava sıcaklığını gecikmeyle izler.')}</div>
   <div class="gauges">${gauge('Kompost/örtü sıcaklığı',S.ctemp,'°C',10,30,16,19,1)}${gauge('Oda CO₂',ventCO2(S.vent),'ppm',0,5000,0,1000)}${gauge('Örtü yüzeyinde nem',humEff,'%',75,99,85,93,1)}<div class="g">${prog('İğne başları',S.pins)}</div></div>
   ${bioNote()}${bioCtl()}
   <div class="sec"><span class="sec-t">Kompost sıcaklığı</span>${chart(S.hist,10,30,16,19,S.day+'. gün')}</div>
   ${done||S.day>=12?`<div class="btns"><button class="pri" data-act="sokdone">Hasada başla</button></div>`:`<div class="btns"><button class="pri" data-act="sok:1">1 gün ilerlet</button></div>`}
   ${S.day>=12&&!done?'<div class="note bad">İğne başları tam oluşmadı. Hasat zayıf olacak.</div>':''}`; }},
 hasat:{cap:()=>{const h=B.h; return h.phase==='running'?`Hasat · ${h.flush+1}. flaş · toplamak için mantara dokunun`:`Hasat · ${Math.min(h.flush+1,3)}. flaş`;},
  info:'Mantarlar şapka zarı (veil) kapalıyken toplanırsa birinci sınıf (A) satılır. Zar yırtılmaya başlayınca B, şapka açılınca C sınıfına düşer. Sıcaklık yükselirse mantarlar hızla açılır; nem %93\'ün üzerindeyse bakteriyel leke görülür. Hasat 7–10 gün arayla gelen 3 flaş (dalga) halinde yapılır.',
  panel(){ const h=B.h; const tot=h.kg.A+h.kg.B+h.kg.C;
   const legend=`<div class="legend"><span><i style="background:#F4F1EA"></i>Küçük (erken)</span><span><i style="background:#FFFFFF;box-shadow:inset 0 0 0 2px #8BE0A6"></i>Kapalı şapka · A</span><span><i style="background:#EFE6D6;box-shadow:inset 0 0 0 2px #C9A57A"></i>Zar açılıyor · B</span><span><i style="background:#E2D5BF;box-shadow:inset 0 0 0 3px #7A5A3D"></i>Açık şapka · C</span></div>`;
   let body='';
   if(h.phase==='ready') body=`<div class="note">Mantarlar örtü toprağından çıkacak. Şapka kapalıyken (beyaz, yuvarlak) toplayın. Bekletirseniz açılır ve değeri düşer; çok bekletirseniz çürür.</div>${legend}<div class="btns"><button class="pri" data-act="flush">1. flaşı başlat</button></div>`;
   if(h.phase==='running') body=`${legend}<div id="live"></div>`;
   if(h.phase==='between') body=`<div class="note ok">${h.flush}. flaş bitti: ${fmt(h.last.A+h.last.B+h.last.C)} kg toplandı, ${fmt(h.last.lost)} kg çürüdü.</div><div class="sec"><span class="sec-t">Flaşlar arası sulama</span><div class="btns"><button data-act="water:0">Az sula <small>6 L/m²</small></button><button class="pri" data-act="water:1">Orta sula <small>10 L/m²</small></button><button data-act="water:2">Bol sula <small>16 L/m²</small></button></div><small style="color:var(--muted)">Az sulama sonraki flaşı küçültür, bol sulama bakteriyel leke riskini artırır.</small></div>`;
   if(h.phase==='done') body=`<div class="note ok">Üç flaş tamamlandı. Toplam ${fmt(tot)} kg mantar kasalarda.</div><div class="btns"><button class="pri" data-act="sell">Ürünü sat ve raporu gör</button></div>`;
   return `<div><h2>Hasat</h2><div class="sub">Beklenen toplam ürün yaklaşık ${fmt(h.totalKg)} kg (${fmt(h.BE*100,1)} kg / 100 kg kompost).</div></div>
   <div class="sec">${slider('hs','Oda sıcaklığı',h.set,13,24,0.5,'°C',v=>h.set=v,'16–18 °C\'de mantarlar yavaş ve düzgün büyür.')}${slider('hh','Bağıl nem',h.hum,78,98,1,'%',v=>h.hum=v)}${slider('hv','Taze hava',h.vent,0,3,1,'',v=>h.vent=v,'CO₂ 1100 ppm\'i geçerse saplar uzar (A sınıfı kaybolur).',v=>VENT[v])}</div>
   ${body}
   <div class="kv"><span>Toplanan A sınıfı</span><span>${fmt(h.kg.A)} kg</span><span>Toplanan B sınıfı</span><span>${fmt(h.kg.B)} kg</span><span>Toplanan C sınıfı</span><span>${fmt(h.kg.C)} kg</span><span>Çürüyen</span><span>${fmt(h.lost)} kg</span></div>`; },
  live(){ if(!H) return ''; const a=H.acc, h=B.h; const co2=ventCO2(h.vent), humEff=h.hum-h.vent*1.2+h.wetBoost;
   const left=H.sp.filter(s=>!s.pk&&!s.dead).length;
   return `<div class="gauges">${gauge('Oda CO₂',co2,'ppm',0,5000,0,1100)}${gauge('Şapka yüzeyinde nem',humEff,'%',75,99,84,93,1)}</div>
   <div class="kv"><span>Bu flaş: A</span><span>${fmt(a.A,1)} kg</span><span>Bu flaş: B</span><span>${fmt(a.B,1)} kg</span><span>Bu flaş: C</span><span>${fmt(a.C,1)} kg</span><span>Bu flaş: çürüyen</span><span>${fmt(a.lost,1)} kg</span><span class="tot">Raftaki mantar</span><span class="tot">${left}</span></div>`; }},
 rapor:{cap:()=>`${G.batchNo}. parti · satış`,
  info:'Biyolojik verim, 100 kg kompost başına hasat edilen mantar miktarıdır. İyi işletmelerde 25–35 kg/100 kg arasındadır. Kârı artırmanın yolu hem verimi hem de A sınıfı oranını yükseltmektir.',
  panel(){ const r=B.rep,h=B.h; const stars=r.BE>=27?3:r.BE>=21?2:r.BE>=14?1:0;
   const tips=tipList();
   const costs=Object.entries(B.costs).sort((a,b)=>b[1]-a[1]);
   return `<div><h2>${G.batchNo}. parti raporu</h2><div class="sub">${STRAINS[B.spawn.strain].name} · ${fmt(B.comp.t,1)} t kompost</div></div>
   <div class="stars" aria-label="${stars} yıldız">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
   <div class="gauges">${gauge('Biyolojik verim',r.BE,'kg/100 kg',0,40,25,35,1)}${gauge('A sınıfı oranı',r.total?h.kg.A/r.total*100:0,'%',0,100,60,100)}</div>
   <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Sınıf</th><th>kg</th><th>₺/kg</th><th>Gelir</th></tr></thead><tbody>
    ${['A','B','C'].map(c=>`<tr><td>${c} sınıfı</td><td>${fmt(h.kg[c])}</td><td>${fmt(PRICE[c]*r.mult,0)}</td><td>${tl(r.rev[c])}</td></tr>`).join('')}
    <tr><td><b>Toplam</b></td><td>${fmt(r.total)}</td><td></td><td><b>${tl(r.revenue)}</b></td></tr></tbody></table></div>
   <div class="kv">${costs.map(([k,v])=>`<span>${k}</span><span>−${tl(v)}</span>`).join('')}<span class="tot">Parti kârı</span><span class="tot" style="color:var(${r.profit>=0?'--ok':'--bad'})">${tl(r.profit)}</span></div>
   <div class="sec"><span class="sec-t">Neler daha iyi olabilirdi?</span>${tips.map(t=>`<div class="note ${t[1]}">${t[0]}</div>`).join('')}</div>
   <div class="sec"><span class="sec-t">Çiftliğe yatırım</span><div class="shop">${UPG.map(u=>`<div class="it"><div><b>${u.name}</b><span>${u.d}</span></div>${G.up[u.id]?'<b style="color:var(--ok)">Kuruldu</b>':`<button data-act="buy:${u.id}" ${G.money<u.price?'disabled':''}>${tl(u.price)}</button>`}</div>`).join('')}</div></div>
   <div class="btns"><button class="pri" data-act="next">${G.batchNo+1}. partiyi başlat</button></div>`; }},
};
function tipList(){ const n=B.notes,t=[];
  if(n.mix) t.push(['Karışım oranları hedef dışındaydı. Azot %1,5–1,9, C/N 20–28, nem %70–77, jips %3–6 olmalı.','warn']);
  if(n.anaer) t.push([`Faz I'de yığın ${n.anaer} gün oksijensiz kaldı. 2–3 günde bir aktarın.`,'warn']);
  if(n.f1short) t.push(['Kompost tam olgunlaşmadan tünele taşındı.','warn']);
  if(n.past) t.push(['Pastörizasyon tamamlanmadı. Küf ve sinek riski arttı.','bad']);
  if(n.over) t.push(['Tünelde kompost 63 °C\'yi aştı, faydalı mikroorganizmalar zarar gördü.','warn']);
  if(n.nh3) t.push([`Ekimde kompostta ${n.nh3} ppm amonyak vardı. 10 ppm altına inmeden ekmeyin.`,'bad']);
  if(n.heat) t.push(['Kuluçkada kompost 30 °C\'yi aştı ve misel zarar gördü. Misel ısındıkça oda sıcaklığını düşürün.','bad']);
  if(n.contam) t.push([`Küf ve sinek bulaşması %${n.contam} seviyesine çıktı. Lekeleri hemen temizleyin, hijyene yatırım yapın.`,'warn']);

  $('#stats').innerHTML=`<div class="stat"><span>Kasa</span><b class="${G.money<0?'neg':''}">${tl(G.money)}</b></div><div class="stat"><span>Gün</span><b>${G.day}</b></div><div class="stat"><span>Parti</span><b>${G.batchNo}</b></div>${G.best!==null?`<div class="stat"><span>En iyi kâr</span><b>${tl(G.best)}</b></div>`:''}<div class="btns">${confirmReset?`<button class="danger" data-act="reset:ok">Sıfırla</button><button data-act="resetno">Vazgeç</button>`:`<button data-act="reset">Yeni oyun</button>`}</div>`;
  const idx=STEPS.findIndex(s=>s.st.includes(B.stage));
  $('#steps').innerHTML=STEPS.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'cur':''}" ${i===idx?'aria-current="step"':''}><span class="n">${i+1}<span class="s"> · ${s.sub}</span></span><span class="t">${s.name}</span></div>`).join('');
  $('#info').innerHTML=`<h3>Gerçek üretimde</h3><p>${st.info}</p>`;
  $('#panel').innerHTML=st.panel();
  const L=$('#live'); if(L&&st.live) L.innerHTML=st.live();
  $('#sceneCap').textContent=st.cap();
  $('#log').innerHTML=B.log.map(l=>`<li class="${l.kind}"><span>Gün ${l.d}</span>${l.msg}</li>`).join('');
  if(act){ const el=document.getElementById(act); if(el) el.focus({preventScroll:true}); }
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const [a,arg]=b.dataset.act.split(':'); const fn=ACT[a]; if(!fn) return;
  fn(arg!==undefined&&!isNaN(+arg)?+arg:arg); save(); render(); });
document.addEventListener('input',e=>{ const el=e.target; const bd=BIND[el.id];
  if(bd){ const v=+el.value; bd.set(v); const o=document.getElementById(el.id+'-o'); if(o) o.textContent=bd.show(v)+(bd.unit?' '+bd.unit:'');
    const L=$('#live'), st=STAGES[B.stage]; if(L&&st.live&&B.stage!=='hasat') L.innerHTML=st.live(); save(); return; }
  const k=el.dataset.bind; if(!k) return;
  if(k==='strain') B.ekim.strain=+el.value; else if(k==='cas') B.ortu.type=+el.value; else B.ekim[k]=el.checked;
  save(); render(); });
scene.addEventListener('pointerdown',e=>{ if(B.stage!=='hasat') return; const r=scene.getBoundingClientRect(); pickAt(e.clientX-r.left,e.clientY-r.top); });

function boot(data){
  G=(data&&data.G)||load()||newGame(); B=G.B;
  if(B.stage==='hasat'&&B.h&&B.h.phase==='running') B.h.phase=B.h.flush===0?'ready':'between';
  if(B.h&&B.h.phase==='between'&&!B.h.last) B.h.last={A:0,B:0,C:0,lost:0};
  if(!B.log.length) log('Çiftliğe hoş geldiniz. Kasada 250.000 ₺ var. İlk iş: kompost karışımını hazırlayın.');
  render(); requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
