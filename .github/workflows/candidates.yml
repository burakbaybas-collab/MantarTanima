name: Yeni tür adayları (GBIF)

on:
  workflow_dispatch:
    inputs:
      keys_only:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - if: ${{ !inputs.keys_only }}
        run: python training/candidates.py && gh release upload egitim-verisi adaylar.csv --clobber
      - run: python training/own_gbif_keys.py && gh release upload egitim-verisi own_keys.csv --clobber
