name: Modeli eğit (GPU, RunPod)

# RunPod'da GPU'lu bir sunucu açar, eğitimi orada yapar, sunucuyu kapatır.
# Modelin telefona dönüştürülmesi, eski modelle karşılaştırma ve uygulamaya ekleme burada yapılır.
# Gerekli gizli anahtar: RUNPOD_API_KEY

on:
  workflow_dispatch:
    inputs:
      per_species:
        description: "Tür başına en fazla fotoğraf"
        default: "1000"
      max_epochs:
        description: "Toplam epoch"
        default: "18"
      model:
        description: "Temel model"
        default: "hf-hub:BVRA/tf_efficientnet_b3.in1k_ft_df20_299"
      img:
        description: "Çözünürlük (piksel)"
        default: "299"
      data_tag:
        description: "Önceden hazırlanmış iNaturalist paketleri (sürüm etiketi; boşsa sunucu kendisi indirir)"
        default: ""
      smoke:
        description: "Hızlı deneme (5 tür, az fotoğraf; sonucu uygulamaya eklemez)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: gpu-egitimi
  cancel-in-progress: false

env:
  RUN_TAG: gpu-egitim-${{ github.run_id }}
  PER_SPECIES: ${{ inputs.smoke && '60' || inputs.per_species }}
  MAX_EPOCHS: ${{ inputs.smoke && '2' || inputs.max_epochs }}
  LIMIT_SPECIES: ${{ inputs.smoke && '5' || '' }}
  HOURS: ${{ inputs.smoke && '0.3' || '3.3' }}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Sonuçlar için geçici sürüm oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RUN_TAG" --title "GPU eğitimi (geçici)" \
            --notes "Eğitim sonuçlarını taşımak için geçici sürüm; iş bitince silinir." --prerelease --target main

      - name: GPU sunucusu aç ve eğitimin bitmesini bekle
        id: pod
        env:
          RP_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          START_CMD="mkdir -p /work && curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/training/runpod_job.sh -o /work/job.sh && bash /work/job.sh"
          make_body() {  # $1 = GPU türü, $2 = COMMUNITY | SECURE
            python3 - "$1" "$2" <<'PY'
          import json, os, sys
          print(json.dumps({
            "name": "mantar-egitim-" + os.environ["GITHUB_RUN_ID"],
            "image": "runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404",
            "cloud": sys.argv[2],
            "gpu": {"id": sys.argv[1], "count": 1, "minRamPerGpu": 24, "minVcpuCountPerGpu": 8,
                    "minCudaVersion": "12.8"},
            "disk": 200,
            "entrypoint": ["bash", "-c"],
            "cmd": [os.environ["START_CMD"]],
            "env": {
              "REPO": os.environ["GITHUB_REPOSITORY"], "RUN_TAG": os.environ["RUN_TAG"],
              "GH_TOKEN": os.environ["GH_TOKEN"], "RP_KEY": os.environ["RP_KEY"],
              "PER_SPECIES": os.environ["PER_SPECIES"], "MAX_EPOCHS": os.environ["MAX_EPOCHS"],
              "MODEL": "${{ inputs.model }}", "IMG": "${{ inputs.img }}", "BATCH": "64",
              "HOURS": os.environ["HOURS"], "LIMIT_SPECIES": os.environ["LIMIT_SPECIES"],
              "DATA_TAG": "${{ inputs.data_tag }}",
              "DEADLINE": os.environ["DEADLINE"],
            },
          }))
          PY
          }
          export START_CMD
          # Bekleme döngüsü 330 dk sürer; sunucuya kapanma saatini bildir
          export DEADLINE=$(( $(date +%s) + 325 * 60 ))
          GPUS=("NVIDIA GeForce RTX 4090" "NVIDIA GeForce RTX 5090" "NVIDIA L40S" "NVIDIA RTX A6000"
                "NVIDIA RTX 6000 Ada Generation" "NVIDIA A40" "NVIDIA GeForce RTX 3090")
          kill_pod() { curl -sS -X DELETE -H "Authorization: Bearer $RP_KEY" "https://api.runpod.io/v2/pods/$1" >/dev/null || true; }
          open_pod() {
            for TRY in 1 2 3; do
              for CLOUD in COMMUNITY SECURE; do
                for GPU in "${GPUS[@]}"; do
                  RESP=$(curl -sS -w '\n%{http_code}' -X POST https://api.runpod.io/v2/pods \
                    -H "Authorization: Bearer $RP_KEY" -H "Content-Type: application/json" \
                    --data "$(make_body "$GPU" $CLOUD)")
                  CODE=$(echo "$RESP" | tail -n1); BODY=$(echo "$RESP" | sed '$d')
                  echo "$CLOUD / $GPU: HTTP $CODE $(echo "$BODY" | head -c 160)"
                  if [ "$CODE" = "201" ] || [ "$CODE" = "200" ]; then
                    POD_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
                    echo "Sunucu açıldı: $POD_ID ($GPU, $CLOUD)"
                    echo "$POD_ID" >> /tmp/podlar.txt
                    return 0
                  fi
                  case "$CODE" in 401|403) echo "API anahtarı yetkisiz."; exit 1;; esac
                done
              done
              sleep 60
            done
            echo "Uygun GPU bulunamadı."; exit 1
          }
          echo "ids=/tmp/podlar.txt" >> "$GITHUB_OUTPUT"
          START=$(date +%s)
          for ATTEMPT in 1 2 3 4; do
            open_pod
            RESULT=""
            while true; do
              sleep 120
              ASSETS=$(gh release view "$RUN_TAG" --json assets -q '.assets[].name' | tr '\n' ' ')
              ELAPSED=$(( ($(date +%s) - START) / 60 ))
              POD=$(curl -sS -H "Authorization: Bearer $RP_KEY" "https://api.runpod.io/v2/pods/$POD_ID" \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'), d.get('cost','?'), 'USD/saat')" 2>/dev/null || echo "yok")
              echo "$ELAPSED dk | sunucu: $POD | dosyalar: $ASSETS"
              case "$ASSETS" in *ilerleme.log*)
                rm -f /tmp/ilerleme.log
                gh release download "$RUN_TAG" -p ilerleme.log -D /tmp >/dev/null 2>&1 && tail -n 3 /tmp/ilerleme.log | sed 's/^/    > /';;
              esac
              case "$ASSETS" in *basarili.txt*) RESULT=ok; break;; *hata.txt*) RESULT=hata; break;; *gpuyok.txt*) RESULT=gpuyok; break;; esac
              if [ $ELAPSED -gt 330 ]; then echo "Süre doldu."; RESULT=sure; break; fi
            done
            if [ "$RESULT" != "gpuyok" ]; then break; fi
            echo "Bu sunucuda GPU çalışmadı; kapatılıp başka sunucu deneniyor."
            kill_pod "$POD_ID"
            for A in $(gh release view "$RUN_TAG" --json assets -q '.assets[].name'); do gh release delete-asset "$RUN_TAG" "$A" --yes || true; done
          done

      - name: Sonuçları indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p training/out sonuc
          gh release download "$RUN_TAG" -D sonuc || true
          ls -la sonuc
          echo "----- Eğitim günlüğünün sonu -----"
          tail -n 60 sonuc/egitim.log || true
          [ -f sonuc/basarili.txt ] || { echo "Eğitim başarısız oldu."; exit 1; }
          cp sonuc/best_model.pt sonuc/per_class.json training/out/
          cp sonuc/rapor_fungi.md training/rapor_fungi.md

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements-fungi.txt

      - name: Telefona uygun hale getir (TFLite)
        run: |
          pip install -r training/requirements-fungi.txt
          python training/export_model.py --ckpt training/out/best_model.pt --out training/out

      - name: Eski modelle karşılaştır
        id: compare
        run: |
          if python training/compare_models.py; then echo "better=true" >> "$GITHUB_OUTPUT"; else echo "better=false" >> "$GITHUB_OUTPUT"; fi
          cat training/out/karsilastirma.md >> training/rapor_fungi.md
          cat training/rapor_fungi.md >> "$GITHUB_STEP_SUMMARY"

      - name: Daha iyiyse uygulamaya ekle ve kaydet
        if: ${{ !inputs.smoke }}
        run: |
          if [ "${{ steps.compare.outputs.better }}" = "true" ]; then
            cp training/out/model.tflite training/out/labels.txt app/src/main/assets/
            cp training/rapor_fungi.md training/rapor.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/rapor_fungi.md training/rapor.md app/src/main/assets/model.tflite app/src/main/assets/labels.txt
          git commit -m "GPU eğitimi sonucu (${{ steps.compare.outputs.better == 'true' && 'uygulamaya alındı' || 'alınmadı' }})" || exit 0
          git pull --rebase
          git push

      - name: Yeni APK derlemesini başlat
        if: ${{ !inputs.smoke && steps.compare.outputs.better == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-sonuc
          path: |
            sonuc/egitim.log
            training/rapor_fungi.md
            training/out/karsilastirma.md
          retention-days: 14

      - name: GPU sunucusunu kesin olarak kapat
        if: always()
        env:
          RP_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          [ -f /tmp/podlar.txt ] || exit 0
          for P in $(cat /tmp/podlar.txt); do
            curl -sS -X DELETE -H "Authorization: Bearer $RP_KEY" "https://api.runpod.io/v2/pods/$P" || true
            echo "Sunucu kapatıldı: $P"
          done

      - name: Geçici sürümü sil
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RUN_TAG" --yes --cleanup-tag || true
