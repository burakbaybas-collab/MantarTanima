name: Mantar algılayıcıyı oluştur

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Kütüphaneleri kur
        run: pip install -r training/requirements.txt

      - name: Algılayıcıyı dışa aktar
        run: python training/export_detector.py

      - name: Repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/detector.tflite
          git commit -m "Mantar algılayıcı modeli eklendi" || exit 0
          git pull --rebase
          git push

      - name: Yeni APK derlemesini başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
