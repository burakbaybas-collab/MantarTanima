name: Bilgisayarda eğitilen modeli uygulamaya al

# Kendi bilgisayarında eğitilen modelin dosyaları (best_model.pt, per_class.json, rapor_fungi.md)
# "pc-egitim" sürümüne tarayıcıdan yüklenir; bu iş onları telefona uygun hale getirir,
# eski modelle karşılaştırır, uygunsa uygulamaya ekleyip APK derler.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Karşılaştırmadan bağımsız olarak uygulamaya al"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Dosyaları indir
        run: |
          mkdir -p training/out
          gh release download pc-egitim -D training/out -p best_model.pt -p per_class.json -p rapor_fungi.md --clobber
          ls -la training/out
          cp training/out/rapor_fungi.md training/rapor_fungi.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements-fungi.txt
      - name: Telefona uygun hale getir (TFLite)
        run: |
          pip install -r training/requirements-fungi.txt
          python training/export_model.py --ckpt training/out/best_model.pt --out training/out
      - name: Eski modelle karşılaştır
        id: compare
        run: |
          if python training/compare_models.py; then echo "better=true" >> "$GITHUB_OUTPUT"; else echo "better=false" >> "$GITHUB_OUTPUT"; fi
          cat training/out/karsilastirma.md >> training/rapor_fungi.md
          cat training/rapor_fungi.md >> "$GITHUB_STEP_SUMMARY"
      - name: Uygulamaya ekle
        if: ${{ steps.compare.outputs.better == 'true' || inputs.force }}
        run: |
          cp training/out/model.tflite training/out/labels.txt app/src/main/assets/
          cp training/rapor_fungi.md training/rapor.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/rapor_fungi.md training/rapor.md app/src/main/assets/model.tflite app/src/main/assets/labels.txt
          git commit -m "Bilgisayarda eğitilen model uygulamaya alındı"
          git pull --rebase
          git push
          gh workflow run build-apk.yml --ref main
      - name: Yedekle (son-egitim)
        if: always()
        run: |
          [ -f training/out/model.tflite ] || exit 0
          gh release view son-egitim >/dev/null 2>&1 || gh release create son-egitim --title "Son eğitim (yedek)" --notes "-" --prerelease
          gh release upload son-egitim training/out/best_model.pt training/rapor_fungi.md training/out/model.tflite training/out/labels.txt --clobber
