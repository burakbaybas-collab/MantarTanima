name: Deneme APK'sı (yeni model, ayrı uygulama)

# Bir GPU eğitiminin modelini, mevcut uygulamanın yanına ayrıca kurulabilen
# "FungiLens Deneme" APK'sına koyar. Eğitim sürüyorsa bitmesini bekler ve
# model silinmeden önce yakalar.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GPU eğitim çalışmasının numarası (train-gpu.yml run id)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Eğitimin bitmesini bekle ve modeli yakala
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="gpu-egitim-${{ inputs.run_id }}"
          mkdir -p model
          for i in $(seq 1 600); do
            NAMES=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | tr '\n' ' ')
            case "$NAMES" in
              *basarili.txt*)
                gh release download "$TAG" -p best_model.pt -p rapor_fungi.md -D model && break ;;
              *hata.txt*) echo "Eğitim başarısız oldu."; exit 1 ;;
            esac
            if [ -z "$NAMES" ] && [ $i -gt 3 ] && ! gh release view "$TAG" >/dev/null 2>&1; then
              # Sürüm yoksa model kalıcı yedekte olabilir
              gh release download deneme-model -p best_model.pt -D model 2>/dev/null && break
              echo "Eğitim sürümü bulunamadı."; exit 1
            fi
            sleep 30
          done
          ls -la model
          [ -f model/best_model.pt ] || exit 1
          # Kalıcı yedek
          gh release view deneme-model >/dev/null 2>&1 || gh release create deneme-model --title "Deneme modeli" --notes "Karşılaştırma için saklanan model" --prerelease
          gh release upload deneme-model model/best_model.pt --clobber
          [ -f model/rapor_fungi.md ] && gh release upload deneme-model model/rapor_fungi.md --clobber || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements-fungi.txt

      - name: Telefona uygun hale getir (TFLite)
        run: |
          pip install -r training/requirements-fungi.txt
          python training/export_model.py --ckpt model/best_model.pt --out model
          cp model/model.tflite model/labels.txt app/src/main/assets/
          wc -l app/src/main/assets/labels.txt

      - name: Ayrı uygulama olarak ayarla
        run: |
          sed -i 's/applicationId = "com.burakbaybas.mantartanima"/applicationId = "com.burakbaybas.mantartanima.deneme"/' app/build.gradle.kts
          sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">FungiLens Deneme</string>|' app/src/main/res/values/strings.xml
          grep -n applicationId app/build.gradle.kts; grep -n app_name app/src/main/res/values/strings.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk FungiLens-Deneme.apk

      - name: Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Deneme modeli (eğitim ${{ inputs.run_id }}). Mevcut uygulamanın yanına ayrıca kurulur."
          if gh release view deneme-surum >/dev/null 2>&1; then
            gh release upload deneme-surum FungiLens-Deneme.apk --clobber
            gh release edit deneme-surum --notes "$NOTES" --prerelease
          else
            gh release create deneme-surum FungiLens-Deneme.apk --title "Deneme sürümü" --notes "$NOTES" --prerelease
          fi
