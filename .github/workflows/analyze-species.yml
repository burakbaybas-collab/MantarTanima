name: Tür adaylarını çıkar (Türkiye + FungiTastic)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Adayları çıkar
        run: python training/analyze_candidates.py
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/aday_turler.csv training/fungitastic_turler.csv
          git commit -m "Tür adayları: Türkiye ve FungiTastic sayıları" || exit 0
          git pull --rebase && git push
