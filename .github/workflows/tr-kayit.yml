name: Türkiye kayıtları (adı olmayan türler)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python training/tr_kayit.py
      - run: gh release upload egitim-verisi tr_kayit.tsv --clobber
