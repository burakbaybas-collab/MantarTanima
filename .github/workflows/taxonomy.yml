name: Sınıflandırma bilgilerini al

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  taxonomy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python training/taxonomy.py
      - name: Kaydet ve APK derlemesini başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/taxonomy.tsv
          git commit -m "Türlerin üst sınıflandırması (GBIF)" || exit 0
          git pull --rebase -q && git push
          gh workflow run build-apk.yml --ref main
