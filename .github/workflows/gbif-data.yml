name: GBIF fotoğraflarını indir

# GBIF'teki açık lisanslı fotoğrafları (iNaturalist ve Danimarka atlası hariç) indirir ve
# "egitim-verisi" sürümüne gbif-veri-<n>.tar olarak yükler. egit_pc.py bunları otomatik kullanır.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Yalnızca bu türler (virgülle; boş = hepsi)"
        default: ""
      per_species:
        default: "200"
      upload:
        description: "Sürüme yükle (deneme için kapatın)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  DATA_TAG: egitim-verisi
  SHARDS: 8

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - name: İndir
        run: |
          python training/fetch_gbif.py --per-species ${{ inputs.per_species }} --workers 24 \
            --shard ${{ matrix.shard }} --shards $SHARDS --max-minutes 290 --only "${{ inputs.only }}"
          mkdir -p training/data_gbif
          echo "Fotoğraf: $(find training/data_gbif -name '*.jpg' | wc -l)"; du -sh training/data_gbif
      - name: Paketle ve yükle
        if: ${{ inputs.upload }}
        run: |
          tar -cf gbif-veri-${{ matrix.shard }}.tar -C training data_gbif
          for i in 1 2 3 4 5; do gh release upload "$DATA_TAG" gbif-veri-${{ matrix.shard }}.tar --clobber && exit 0; sleep 20; done
          exit 1
