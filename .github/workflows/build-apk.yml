name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK'yı "son-surum" sürümüne yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MantarTanima.apk
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum MantarTanima.apk \
            --title "Son sürüm (deneme)" \
            --notes "Otomatik derleme: ${GITHUB_SHA::7}. Telefondan indirip kurabilirsiniz." \
            --prerelease
