name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Aynı anda iki derleme yayını bozmasın: yenisi gelince eskisi iptal edilir
concurrency:
  group: apk-derle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK'yı "son-surum" sürümüne yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MantarTanima.apk
          # Önceki yarım kalmış taslak sürümleri temizle
          for id in $(gh api repos/${{ github.repository }}/releases -q '.[] | select(.draft) | .id'); do
            gh api -X DELETE repos/${{ github.repository }}/releases/$id || true
          done
          NOTES="Otomatik derleme: ${GITHUB_SHA::7}. Telefondan indirip kurabilirsiniz."
          if gh release view son-surum >/dev/null 2>&1; then
            gh release upload son-surum MantarTanima.apk --clobber
            gh release edit son-surum --notes "$NOTES" --prerelease
          else
            gh release create son-surum MantarTanima.apk --title "Son sürüm (deneme)" --notes "$NOTES" --prerelease
          fi
