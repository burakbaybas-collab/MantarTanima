name: Deneme modelini uygulamaya al

# "deneme-model" sürümündeki modeli (karşılaştırma sonucundan bağımsız) ana uygulamaya alır.
# İsteğe bağlı: önce belirtilen deneme APK iş akışının bitmesini bekler.

on:
  workflow_dispatch:
    inputs:
      wait_run_id:
        description: "Önce bitmesi beklenecek test-apk çalışması (boş bırakılabilir)"
        default: ""
      source:
        description: "Modelin alınacağı sürüm (deneme-model veya son-egitim)"
        default: "son-egitim"

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Deneme APK işinin bitmesini bekle
        if: ${{ inputs.wait_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 280); do
            S=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.wait_run_id }} -q '.status + " " + (.conclusion // "")')
            echo "$S"
            case "$S" in completed*) break;; esac
            sleep 60
          done
          case "$S" in "completed success") ;; *) echo "Deneme APK işi başarısız"; exit 1;; esac
      - name: Modeli indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p model
          gh release download "${{ inputs.source }}" -p best_model.pt -p rapor_fungi.md -D model
          ls -la model
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements-fungi.txt
      - name: Telefona uygun hale getir
        run: |
          pip install -r training/requirements-fungi.txt
          python training/export_model.py --ckpt model/best_model.pt --out model
      - name: Uygulamaya ekle ve kaydet
        run: |
          git pull --rebase
          cp model/model.tflite model/labels.txt app/src/main/assets/
          cp model/rapor_fungi.md training/rapor.md
          cp model/rapor_fungi.md training/rapor_fungi.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/model.tflite app/src/main/assets/labels.txt training/rapor.md training/rapor_fungi.md
          git commit -m "Yeni model uygulamaya alındı ($(wc -l < app/src/main/assets/labels.txt) tür)"
          git push
      - name: Yeni APK derlemesini başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
