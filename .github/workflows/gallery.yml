name: Galeri oluştur

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Modeli eğit"]
    types: [completed]

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Galeriyi oluştur
        run: |
          pip install requests
          python training/make_gallery.py --per-species 12

      - name: Repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add galeri
          git commit -m "Eğitim fotoğrafları galerisi güncellendi" || exit 0
          git pull --rebase
          git push
