name: Modeli eğit (uzun, 3 aşamalı)

# Bulut sunucusunda tek iş en fazla 6 saat sürebilir. Eğitim üç aşamaya bölünür;
# her aşama kaldığı yeri (devir dosyası) bir sonrakine aktarır. Fotoğraflar bir kez indirilir.

on:
  workflow_dispatch:
    inputs:
      per_species:
        description: "Tür başına en fazla fotoğraf"
        default: "300"
      max_epochs:
        description: "Toplam epoch (1'i yalnızca sınıflandırıcı)"
        default: "10"
      resume_run_id:
        description: "Önceki çalıştırmanın numarası (1. aşamanın devir dosyasından devam etmek için; boş = baştan)"
        default: ""
      smoke:
        description: "Hızlı deneme (az fotoğraf, kısa aşamalar; sonucu kaydetmez)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ inputs.smoke && 'deneme' || 'model-egitimi' }}
  cancel-in-progress: false

env:
  PER_SPECIES: ${{ inputs.smoke && '45' || inputs.per_species }}
  MAX_EPOCHS: ${{ inputs.smoke && '3' || inputs.max_epochs }}
  STAGE_HOURS: ${{ inputs.smoke && '0.02' || '5.0' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      key: ${{ steps.k.outputs.key }}
      dfkey: ${{ steps.k.outputs.dfkey }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        run: |
          echo "key=inat-${{ hashFiles('app/src/main/assets/species.tsv') }}-${{ env.PER_SPECIES }}" >> "$GITHUB_OUTPUT"
          echo "dfkey=df20-${{ hashFiles('app/src/main/assets/species.tsv') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: training/data
          key: ${{ steps.k.outputs.key }}
          restore-keys: inat-
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.smoke }}
        with:
          path: training/data_df20
          key: ${{ steps.k.outputs.dfkey }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: iNaturalist fotoğraflarını indir
        run: python training/fetch_inat.py --per-species ${{ env.PER_SPECIES }}
      - name: Danish Fungi 2020 fotoğraflarını ekle
        if: ${{ !inputs.smoke }}
        continue-on-error: true
        timeout-minutes: 120
        run: python training/fetch_df20.py --per-species 200
      - name: Önbelleğe kaydet (iNaturalist)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: training/data
          key: ${{ steps.k.outputs.key }}
      - name: Önbelleğe kaydet (DF20)
        if: ${{ !inputs.smoke }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: training/data_df20
          key: ${{ steps.k.outputs.dfkey }}

  stage1:
    if: ${{ inputs.resume_run_id == '' }}
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: training/data
          key: ${{ needs.fetch.outputs.key }}
          restore-keys: inat-
      - uses: actions/cache/restore@v4
        with:
          path: training/data_df20
          key: ${{ needs.fetch.outputs.dfkey }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements-fungi.txt
      - run: pip install -r training/requirements-fungi.txt
      - name: Önbellek silinmişse fotoğrafları yeniden indir
        run: |
          N=$(find training/data -type f -name '*.jpg' 2>/dev/null | wc -l)
          echo "Önbellekteki fotoğraf: $N"
          if [ "$N" -lt 20000 ] && [ "${{ inputs.smoke }}" != "true" ]; then
            python training/fetch_inat.py --per-species ${{ env.PER_SPECIES }}
          elif [ "${{ inputs.smoke }}" = "true" ]; then
            python training/fetch_inat.py --per-species ${{ env.PER_SPECIES }}
          fi
      - name: Eğitim – 1. aşama
        run: python training/train_fungi.py --limit-per-class ${{ env.PER_SPECIES }}  --hours $(python -c "import time; e=(time.time()-${{ steps.t0.outputs.start }})/3600; print(max(0.3, min(${{ env.STAGE_HOURS }}, 5.55 - e)))") --max-epochs ${{ env.MAX_EPOCHS }}
      - uses: actions/upload-artifact@v4
        with:
          name: devir-1
          path: training/out/ckpt.pt
          retention-days: 5

  stage2:
    needs: [fetch, stage1]
    if: ${{ always() && needs.fetch.result == 'success' && (needs.stage1.result == 'success' || needs.stage1.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: training/data
          key: ${{ needs.fetch.outputs.key }}
          restore-keys: inat-
      - uses: actions/cache/restore@v4
        with:
          path: training/data_df20
          key: ${{ needs.fetch.outputs.dfkey }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements-fungi.txt
      - run: pip install -r training/requirements-fungi.txt
      - name: Önbellek silinmişse fotoğrafları yeniden indir
        run: |
          N=$(find training/data -type f -name '*.jpg' 2>/dev/null | wc -l)
          echo "Önbellekteki fotoğraf: $N"
          if [ "$N" -lt 20000 ] && [ "${{ inputs.smoke }}" != "true" ]; then
            python training/fetch_inat.py --per-species ${{ env.PER_SPECIES }}
          elif [ "${{ inputs.smoke }}" = "true" ]; then
            python training/fetch_inat.py --per-species ${{ env.PER_SPECIES }}
          fi
      - name: Devir dosyası (önceki çalıştırmadan)
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: devir-1
          path: training/out
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Devir dosyası (bu çalıştırmadan)
        if: ${{ inputs.resume_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: devir-1
          path: training/out
      - name: Eğitim – 2. aşama
        run: python training/train_fungi.py --limit-per-class ${{ env.PER_SPECIES }} --resume --hours $(python -c "import time; e=(time.time()-${{ steps.t0.outputs.start }})/3600; print(max(0.3, min(${{ env.STAGE_HOURS }}, 5.55 - e)))") --max-epochs ${{ env.MAX_EPOCHS }}
      - uses: actions/upload-artifact@v4
        with:
          name: devir-2
          path: training/out/ckpt.pt
          retention-days: 5

  stage3:
    needs: [fetch, stage2]
    if: ${{ always() && needs.fetch.result == 'success' && needs.stage2.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: training/data
          key: ${{ needs.fetch.outputs.key }}
          restore-keys: inat-
      - uses: actions/cache/restore@v4
        with:
          path: training/data_df20
          key: ${{ needs.fetch.outputs.dfkey }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements-fungi.txt
      - run: pip install -r training/requirements-fungi.txt
      - name: Önbellek silinmişse fotoğrafları yeniden indir
        run: |
          N=$(find training/data -type f -name '*.jpg' 2>/dev/null | wc -l)
          echo "Önbellekteki fotoğraf: $N"
          if [ "$N" -lt 20000 ] && [ "${{ inputs.smoke }}" != "true" ]; then
            python training/fetch_inat.py --per-species ${{ env.PER_SPECIES }}
          elif [ "${{ inputs.smoke }}" = "true" ]; then
            python training/fetch_inat.py --per-species ${{ env.PER_SPECIES }}
          fi
      - uses: actions/download-artifact@v4
        with:
          name: devir-2
          path: training/out
      - name: Eğitim – 3. aşama ve dışa aktarma
        run: python training/train_fungi.py --limit-per-class ${{ env.PER_SPECIES }} --resume --final --hours $(python -c "import time; e=(time.time()-${{ steps.t0.outputs.start }})/3600; print(max(0.3, min(${{ env.STAGE_HOURS }}, 5.55 - e)))") --max-epochs ${{ env.MAX_EPOCHS }}

      - name: Eski modelle karşılaştır
        id: compare
        run: |
          if python training/compare_models.py; then echo "better=true" >> "$GITHUB_OUTPUT"; else echo "better=false" >> "$GITHUB_OUTPUT"; fi
          cat training/out/karsilastirma.md >> training/rapor_fungi.md
          cat training/out/karsilastirma.md >> "$GITHUB_STEP_SUMMARY"

      - name: Daha iyiyse uygulamaya ekle ve kaydet
        if: ${{ !inputs.smoke }}
        run: |
          if [ "${{ steps.compare.outputs.better }}" = "true" ]; then
            cp training/out/model.tflite training/out/labels.txt app/src/main/assets/
            cp training/rapor_fungi.md training/rapor.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/rapor_fungi.md training/rapor.md app/src/main/assets/model.tflite app/src/main/assets/labels.txt
          git commit -m "Uzun eğitim sonucu (${{ steps.compare.outputs.better == 'true' && 'uygulamaya alındı' || 'alınmadı' }})" || exit 0
          git pull --rebase
          git push

      - name: Yeni APK derlemesini başlat
        if: ${{ !inputs.smoke && steps.compare.outputs.better == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonuc
          path: |
            training/rapor_fungi.md
            training/out/karsilastirma.md
          retention-days: 7
