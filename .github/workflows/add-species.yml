name: Yeni türlerin iNaturalist fotoğrafları

# training/yeni_ids.txt içindeki türleri 8 parçada indirir, veri-yama-ek-<n>.tar olarak
# "egitim-verisi" sürümüne yükler (RunPod ve egit_pc.py veri-yama* paketlerini otomatik açar).

on:
  workflow_dispatch:
    inputs:
      per_species:
        default: "500"
      ids_file:
        description: "Tür listesi dosyası"
        default: "training/yeni_ids.txt"
      prefix:
        description: "Paket adı eki (veri-yama-<ek>-n.tar)"
        default: "ek"

permissions:
  contents: write

env:
  DATA_TAG: egitim-verisi

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - name: İndir
        run: |
          IDS=$(awk -v s=${{ matrix.shard }} 'NF && (NR-1)%8==s' ${{ inputs.ids_file }} | paste -sd,)
          echo "Türler: $IDS"
          python training/fetch_inat.py --only "$IDS" --per-species ${{ inputs.per_species }} --workers 16
      - name: Küçült ve paketle
        run: |
          rm -f training/data/*/_kaynaklar.csv.bak
          python training/shrink_images.py training/data
          for d in training/data/*/; do echo "$d: $(ls $d | wc -l)"; done
          tar -cf veri-yama-${{ inputs.prefix }}-${{ matrix.shard }}.tar -C training data
      - name: Yükle
        run: |
          for i in 1 2 3 4 5; do gh release upload "$DATA_TAG" veri-yama-${{ inputs.prefix }}-${{ matrix.shard }}.tar --clobber && exit 0; sleep 20; done
          exit 1
